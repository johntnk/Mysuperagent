@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#171b23;--ink:#e6e8ee;--muted:#9aa3b2;--line:#2a303b;--accent:#7aa2ff;--agent:#18233a;--agent-ink:#c9d8ff;--warn:#f0b35a;--chip:#222833}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}p.sub{margin:0 0 10px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;color:var(--muted);font-size:12px}
button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit}
main{padding:12px 16px 40px}
.row{display:grid;grid-template-columns:44px 1fr 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.n{color:var(--muted);font-size:12px;text-align:right;padding-top:2px}
.msg,.ans{min-width:0;white-space:pre-wrap;word-break:break-word}
.who{font-weight:600}.time{color:var(--muted);font-size:12px;margin-left:6px}
.note{color:var(--warn);font-size:12px;margin-top:4px}
.ans.spoke{background:var(--agent);color:var(--agent-ink);border-radius:10px;padding:8px 10px}
.ans.silent,.ans.rejected{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:600;letter-spacing:.02em;display:block;margin-bottom:2px}
.colhead{display:grid;grid-template-columns:44px 1fr 1fr;gap:12px;color:var(--muted);font-size:12px;padding-top:10px}
@media (max-width:720px){.row,.colhead{grid-template-columns:1fr}.n{text-align:left}.colhead{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>群聊回放对照（脱敏）</h1>

<button data-f="all" aria-pressed="true">全部</button>
<button data-f="spoke" aria-pressed="false">只看发言</button>
<button data-f="rejected" aria-pressed="false">校验拒绝</button>
<input id="q" type="search" placeholder="搜索消息或回应">
</div>
<div class="colhead"><span></span><span>群聊（脱敏）</span><span>Agent</span></div>
</div></header>

];
const list = document.getElementById('list'), q = document.getElementById('q');
let filter = 'all';
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
function render() {
  const term = q.value.trim();
  list.replaceChildren();
  let shown = 0;
  for (const r of DATA) {
    if (filter !== 'all' && r.agent !== filter) continue;
    if (term && !(r.text + r.reply + r.why).includes(term)) continue;
    shown++;
    const row = el('div', 'row');
    row.append(el('div', 'n', '#' + r.n));
    const msg = el('div', 'msg');
    const head = el('div'); head.append(el('span', 'who', r.sender), el('span', 'time', r.time));
    msg.append(head, el('div', '', r.text));
    if (r.notes.length) msg.append(el('div', 'note', '注：' + r.notes.join('；')));
    const ans = el('div', 'ans ' + r.agent);
    if (r.agent === 'spoke') { ans.append(el('span', 'tag', 'Agent 发言'), el('span', '', r.reply)); }
    else if (r.agent === 'silent') { ans.append(el('span', 'tag', '沉默'), el('span', '', r.why)); }
    else { ans.append(el('span', 'tag', '输出未通过校验'), el('span', '', r.why)); }
    row.append(msg, ans);
    list.append(row);
  }
  document.getElementById('stats').textContent = `显示 ${shown} / ${DATA.length} 条`;
}
for (const b of document.querySelectorAll('button[data-f]')) b.onclick = () => {
  filter = b.dataset.f;
  for (const x of document.querySelectorAll('button[data-f]')) x.setAttribute('aria-pressed', String(x === b));
  render();
};
q.oninput = render;
render();
</script>
